name: Release

# 打 tag（v1.2.3 / v1.2.3-beta.1）自动出 Windows 安装包并创建 Release。
# workflow_dispatch 是"演练"：只出 Actions artifact，不创建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '仅构建验证用的版本号（如 0.0.0-test），不会创建 Release'
        required: true
        default: '0.0.0-test'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建安装包
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # --generate-notes 需要完整 tag 历史

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
            $isRelease = 'false'
          } else {
            $version = '${{ github.ref_name }}'
            $isRelease = 'true'
          }
          $version = $version.Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "非法版本号：$version（应为 v1.2.3 或 v1.2.3-beta.1）"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_release=$isRelease" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version -match '-') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: 编译并打包（自包含 exe + 便携 zip + 安装包）
        shell: pwsh
        run: ./tools/release.ps1 -Version ${{ steps.version.outputs.version }} -RequireInstaller

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BingWallpaper-${{ steps.version.outputs.version }}
          path: |
            dist/BingWallpaper-Setup-*.exe
            dist/BingWallpaper-*-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: steps.version.outputs.is_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(Get-ChildItem dist -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object { $_.FullName })
          $assets += (Resolve-Path dist/SHA256SUMS.txt).Path
          $ghArgs = @('--title', $tag, '--generate-notes', '--verify-tag')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh release create $tag @assets @ghArgs
